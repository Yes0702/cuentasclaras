<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Examen de Daniel</title>
<style>
  :root {
    --bg: #f6f3ec;
    --card: #ffffff;
    --text: #2a2620;
    --muted: #6d665b;
    --accent: #7a4e1d;
    --accent-soft: #f1e6d6;
    --border: #e2dbcd;
    --ok: #1f7a3d;
    --ok-bg: #e5f4ea;
    --bad: #b3261e;
    --bad-bg: #fbe9e7;
    --verse-bg: #faf6ee;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1915;
      --card: #25221d;
      --text: #ece6da;
      --muted: #a89f90;
      --accent: #e0a85e;
      --accent-soft: #3a3024;
      --border: #3a352c;
      --ok: #6fd18f;
      --ok-bg: #1d3325;
      --bad: #ff8a80;
      --bad-bg: #3a2120;
      --verse-bg: #2c2822;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.5;
  }
  header {
    text-align: center;
    padding: 28px 16px 8px;
  }
  header h1 { margin: 0 0 4px; font-size: 1.9rem; color: var(--accent); }
  header p { margin: 0; color: var(--muted); font-size: .95rem; }
  .tabs {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    padding: 16px; position: sticky; top: 0; background: var(--bg); z-index: 5;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 8px 14px; border-radius: 999px; cursor: pointer; font: inherit; font-size: .95rem;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab .badge { font-size: .75rem; margin-left: 4px; opacity: .85; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  .chapter-title { margin: 8px 0 4px; font-size: 1.4rem; }
  .chapter-sub { color: var(--muted); margin: 0 0 16px; font-size: .95rem; }
  .q {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 14px;
  }
  .q.correct { border-color: var(--ok); }
  .q.wrong { border-color: var(--bad); }
  .q-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 10px; }
  .q-num {
    flex: none; background: var(--accent-soft); color: var(--accent);
    font-weight: bold; border-radius: 8px; padding: 2px 8px; font-size: .9rem;
  }
  .q-type { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .q-text { font-size: 1.05rem; }
  .options { display: grid; gap: 8px; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px;
    border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
  }
  .opt:hover { background: var(--accent-soft); }
  .opt input { margin-top: 5px; accent-color: var(--accent); }
  .opt.is-correct { background: var(--ok-bg); border-color: var(--ok); }
  .opt.is-wrong { background: var(--bad-bg); border-color: var(--bad); }
  .fill {
    width: 100%; padding: 10px 12px; font: inherit; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .fill:focus { outline: 2px solid var(--accent); }
  .feedback { margin-top: 12px; border-radius: 8px; padding: 10px 12px; display: none; }
  .feedback.show { display: block; }
  .feedback.ok { background: var(--ok-bg); color: var(--ok); font-weight: bold; }
  .feedback.bad { background: var(--bad-bg); color: var(--text); }
  .feedback.bad .label { color: var(--bad); font-weight: bold; }
  .verse {
    margin-top: 8px; background: var(--verse-bg); border-left: 4px solid var(--accent);
    padding: 8px 12px; border-radius: 4px; font-style: italic;
  }
  .verse b { font-style: normal; color: var(--accent); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 40px; justify-content: center; }
  .btn {
    font: inherit; padding: 10px 22px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  .btn.secondary { background: transparent; color: var(--accent); }
  .score {
    text-align: center; font-size: 1.2rem; margin: 10px 0; padding: 14px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; display: none;
  }
  .score.show { display: block; }
  .score strong { color: var(--accent); font-size: 1.5rem; }
</style>
</head>
<body>
<header>
  <h1>Examen del libro de Daniel</h1>
  <p>Capítulos 1 al 6 · Reina Valera 1995 · 20 preguntas por capítulo</p>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="app"></main>

<script>
// Versículos citados en la retroalimentación (Reina Valera 1995)
const V = {
  "1:1": "En el tercer año del reinado de Joacim, rey de Judá, vino Nabucodonosor, rey de Babilonia, a Jerusalén, y la sitió.",
  "1:2": "El Señor entregó en sus manos a Joacim, rey de Judá, y parte de los utensilios de la casa de Dios; los trajo a tierra de Sinar, a la casa de su dios, y colocó los utensilios en la casa del tesoro de su dios.",
  "1:3": "Y dijo el rey a Aspenaz, jefe de sus eunucos, que trajera de los hijos de Israel, del linaje real de los príncipes,",
  "1:4": "muchachos en quienes no hubiera tacha alguna, de buen parecer, instruidos en toda sabiduría, sabios en ciencia, de buen entendimiento e idóneos para estar en el palacio del rey; y que les enseñara las letras y la lengua de los caldeos.",
  "1:5": "Y les señaló el rey una porción diaria de la comida del rey y del vino que él bebía; y que los educara durante tres años, para que al fin de ellos se presentaran delante del rey.",
  "1:6": "Entre ellos estaban Daniel, Ananías, Misael y Azarías, de los hijos de Judá.",
  "1:7": "A estos el jefe de los eunucos puso nombres: a Daniel, Beltsasar; a Ananías, Sadrac; a Misael, Mesac; y a Azarías, Abed-nego.",
  "1:8": "Daniel propuso en su corazón no contaminarse con la porción de la comida del rey ni con el vino que él bebía; pidió, por tanto, al jefe de los eunucos que no se le obligara a contaminarse.",
  "1:10": "y el jefe de los eunucos dijo a Daniel: —Temo a mi señor el rey, que asignó vuestra comida y vuestra bebida; pues luego que él vea vuestros rostros más pálidos que los de los muchachos que son semejantes a vosotros, haréis que el rey me condene a muerte.",
  "1:11": "Entonces dijo Daniel a Melsar, a quien el jefe de los eunucos había puesto sobre Daniel, Ananías, Misael y Azarías:",
  "1:12": "—Te ruego que hagas la prueba con tus siervos durante diez días: que nos den legumbres para comer y agua para beber.",
  "1:15": "Y al cabo de los diez días pareció el rostro de ellos mejor y más robusto que el de los otros muchachos que comían de la porción de la comida del rey.",
  "1:17": "A estos cuatro muchachos, Dios les dio conocimiento e inteligencia en todas las letras y ciencias; y Daniel tuvo entendimiento en toda visión y sueños.",
  "1:20": "En todo asunto de sabiduría e inteligencia que el rey los consultó, los halló diez veces mejores que todos los magos y astrólogos que había en todo su reino.",
  "1:21": "Así continuó Daniel hasta el año primero del rey Ciro.",

  "2:1": "En el segundo año del reinado de Nabucodonosor, tuvo Nabucodonosor sueños, y se turbó su espíritu y se le fue el sueño.",
  "2:4": "Entonces hablaron los caldeos al rey en lengua aramea: —¡Rey, para siempre vive! Cuenta el sueño a tus siervos, y te daremos la interpretación.",
  "2:5": "Respondió el rey y dijo a los caldeos: —El asunto lo olvidé; pero si no me decís el sueño y su interpretación, seréis hechos pedazos y vuestras casas serán convertidas en estercoleros.",
  "2:11": "Porque el asunto que el rey demanda es difícil, y no hay quien lo pueda declarar al rey, salvo los dioses cuya morada no está entre los hombres.",
  "2:12": "Por esto el rey, con ira y con gran enojo, mandó que mataran a todos los sabios de Babilonia.",
  "2:14": "Entonces Daniel habló sabia y prudentemente a Arioc, capitán de la guardia del rey, que había salido para matar a los sabios de Babilonia.",
  "2:16": "y Daniel entró y pidió al rey que le concediera tiempo, que él daría al rey la interpretación.",
  "2:19": "El secreto le fue revelado a Daniel en visión de noche, por lo cual bendijo Daniel al Dios del cielo.",
  "2:21": "Él muda los tiempos y las edades, quita reyes y pone reyes; da la sabiduría a los sabios y la ciencia a los entendidos.",
  "2:30": "Y a mí me ha sido revelado este misterio, no porque en mí haya más sabiduría que en los demás vivientes, sino para que se dé a conocer al rey la interpretación y para que entiendas los pensamientos de tu corazón.",
  "2:32": "La cabeza de esta imagen era de oro fino; su pecho y sus brazos, de plata; su vientre y sus muslos, de bronce;",
  "2:33": "sus piernas, de hierro; sus pies, en parte de hierro y en parte de barro cocido.",
  "2:34": "Estabas mirando, hasta que una piedra se desprendió sin que la cortara mano alguna, e hirió a la imagen en sus pies de hierro y de barro cocido, y los desmenuzó.",
  "2:35": "Entonces fueron desmenuzados también el hierro, el barro cocido, el bronce, la plata y el oro, y fueron como tamo de las eras del verano, y se los llevó el viento sin que de ellos quedara rastro alguno. Pero la piedra que hirió a la imagen se hizo un gran monte que llenó toda la tierra.",
  "2:38": "Dondequiera que habitan hijos de hombres, bestias del campo y aves del cielo, él los ha entregado en tus manos, y te ha dado el dominio sobre todo. Tú eres aquella cabeza de oro.",
  "2:40": "Y el cuarto reino será fuerte como el hierro; y como el hierro desmenuza y rompe todas las cosas, así él lo desmenuzará y lo quebrantará todo.",
  "2:44": "En los días de estos reyes, el Dios del cielo levantará un reino que no será jamás destruido, ni será el reino dejado a otro pueblo; desmenuzará y consumirá a todos estos reinos, pero él permanecerá para siempre,",
  "2:48": "Entonces el rey engrandeció a Daniel, le dio muchos honores y grandes dones, y lo hizo gobernador de toda la provincia de Babilonia y jefe supremo de todos los sabios de Babilonia.",

  "3:1": "El rey Nabucodonosor hizo una estatua de oro, cuya altura era de sesenta codos y la anchura de seis codos; la levantó en el campo de Dura, en la provincia de Babilonia.",
  "3:5": "que al oír el son de la bocina, la flauta, la cítara, el arpa, el salterio, la zampoña y todo instrumento de música, os postréis y adoréis la estatua de oro que el rey Nabucodonosor ha levantado;",
  "3:6": "y cualquiera que no se postre y adore, inmediatamente será echado dentro de un horno de fuego ardiente.",
  "3:8": "Por esto, en aquel tiempo algunos hombres caldeos vinieron y acusaron maliciosamente a los judíos.",
  "3:15": "Ahora, pues, ¿estáis dispuestos para que, al oír el son de la bocina, la flauta, la cítara, el arpa, el salterio, la zampoña y todo instrumento de música, os postréis y adoréis la estatua que he hecho? Porque si no la adoráis, en la misma hora seréis echados en medio de un horno de fuego ardiente, ¿y qué dios será el que os libre de mis manos?",
  "3:17": "Nuestro Dios, a quien servimos, puede librarnos del horno de fuego ardiente; y de tus manos, rey, nos librará.",
  "3:18": "Y si no, has de saber, oh rey, que no serviremos a tus dioses ni tampoco adoraremos la estatua que has levantado.",
  "3:19": "Entonces Nabucodonosor se llenó de ira, cambió el aspecto de su rostro contra Sadrac, Mesac y Abed-nego y ordenó que el horno se calentara siete veces más de lo acostumbrado.",
  "3:21": "Así pues, estos hombres fueron atados con sus mantos, sus calzados, sus turbantes y sus vestidos, y fueron echados dentro del horno de fuego ardiente.",
  "3:22": "Y como la orden del rey era apremiante, y habían calentado mucho el horno, la llama del fuego mató a aquellos que habían alzado a Sadrac, Mesac y Abed-nego.",
  "3:25": "Y él dijo: —Sin embargo, yo veo cuatro hombres sueltos, que se pasean en medio del fuego sin sufrir ningún daño; y el aspecto del cuarto es semejante a un hijo de los dioses.",
  "3:26": "Entonces Nabucodonosor se acercó a la puerta del horno de fuego ardiente, y dijo: —Sadrac, Mesac y Abed-nego, siervos del Dios Altísimo, salid y venid. Sadrac, Mesac y Abed-nego salieron de en medio del fuego.",
  "3:27": "Y se juntaron los sátrapas, los gobernadores, los capitanes y los consejeros del rey para mirar a estos hombres, cómo el fuego no había tenido poder alguno sobre sus cuerpos y ni aun el cabello de sus cabezas se había quemado; sus ropas, intactas, ni siquiera olor de fuego tenían.",
  "3:28": "Y Nabucodonosor dijo: «Bendito sea el Dios de Sadrac, Mesac y Abed-nego, que envió su ángel y libró a sus siervos que confiaron en él, los cuales no cumplieron el edicto del rey y entregaron sus cuerpos antes que servir y adorar a otro dios que su Dios.",
  "3:29": "Por lo tanto, decreto que todo pueblo, nación o lengua que diga blasfemia contra el Dios de Sadrac, Mesac y Abed-nego, sea descuartizado, y su casa convertida en estercolero; por cuanto no hay dios que pueda librar como este.»",

  "4:1": "«Nabucodonosor, rey, a todos los pueblos, naciones y lenguas que moran en toda la tierra: Paz os sea multiplicada.",
  "4:3": "¡Cuán grandes son sus señales y cuán potentes sus maravillas! Su reino, reino sempiterno; su señorío, de generación en generación.",
  "4:4": "»Yo, Nabucodonosor, estaba tranquilo en mi casa, floreciente en mi palacio.",
  "4:10": "Estas fueron las visiones de mi cabeza mientras estaba en mi cama: »”Me parecía ver en medio de la tierra un árbol cuya altura era grande.",
  "4:11": "Crecía este árbol, y se hacía fuerte, y su copa llegaba hasta el cielo y se le alcanzaba a ver desde todos los confines de la tierra.",
  "4:13": "»”Vi en las visiones de mi cabeza, mientras estaba en mi cama, que un vigilante y santo descendía del cielo.",
  "4:15": "Mas la cepa de sus raíces dejaréis en la tierra, con atadura de hierro y de bronce entre la hierba del campo; que lo empape el rocío del cielo, y con las bestias sea su parte entre la hierba de la tierra.",
  "4:16": "Su corazón de hombre sea cambiado y le sea dado corazón de bestia, y pasen sobre él siete tiempos.",
  "4:17": "La sentencia es por decreto de los vigilantes y por dicho de los santos la resolución, para que conozcan los vivientes que el Altísimo gobierna el reino de los hombres, que a quien él quiere lo da y sobre él constituye al más humilde de los hombres.’",
  "4:19": "Entonces Daniel, cuyo nombre era Beltsasar, quedó atónito casi una hora, y sus pensamientos lo turbaban. El rey habló y dijo: —Beltsasar, no te turben ni el sueño ni su interpretación. Beltsasar respondió y dijo: —Señor mío, el sueño sea para tus enemigos y su interpretación para los que mal te quieren.",
  "4:22": "tú mismo eres, oh rey, que creciste y te hiciste fuerte, pues creció tu grandeza y ha llegado hasta el cielo, y tu dominio hasta los confines de la tierra.",
  "4:26": "Y en cuanto a la orden de dejar en la tierra la cepa de las raíces del mismo árbol, significa que tu reino te quedará firme, después que reconozcas que es el cielo el que gobierna.",
  "4:27": "Por tanto, oh rey, acepta mi consejo: redime tus pecados con justicia, y tus iniquidades haciendo misericordias con los oprimidos, pues tal vez será eso una prolongación de tu tranquilidad.",
  "4:29": "Al cabo de doce meses, paseando por el palacio real de Babilonia,",
  "4:30": "habló el rey y dijo: «¿No es esta la gran Babilonia que yo edifiqué para casa real con la fuerza de mi poder, y para gloria de mi majestad?»",
  "4:33": "En la misma hora se cumplió la palabra sobre Nabucodonosor: Fue echado de entre los hombres, comía hierba como los bueyes y su cuerpo se empapaba del rocío del cielo, hasta que su pelo creció como plumas de águila y sus uñas como las de las aves.",
  "4:34": "«Al fin del tiempo, yo, Nabucodonosor, alcé mis ojos al cielo y mi razón me fue devuelta; bendije al Altísimo, y alabé y glorifiqué al que vive para siempre: »“Su dominio es sempiterno; su reino, por todas las edades.",
  "4:37": "»Ahora yo, Nabucodonosor, alabo, engrandezco y glorifico al Rey del cielo, porque todas sus obras son verdaderas y sus caminos justos; y él puede humillar a los que andan con soberbia.»",

  "5:1": "El rey Belsasar hizo un gran banquete a mil de sus príncipes, y en presencia de los mil bebía vino.",
  "5:2": "Belsasar, con el gusto del vino, mandó que trajeran los vasos de oro y de plata que Nabucodonosor, su padre, había traído del templo de Jerusalén, para que bebieran de ellos el rey y sus grandes, sus mujeres y sus concubinas.",
  "5:4": "Bebieron vino y alabaron a los dioses de oro y plata, de bronce, de hierro, de madera y de piedra.",
  "5:5": "En aquella misma hora aparecieron los dedos de una mano de hombre que escribía delante del candelabro, sobre lo encalado de la pared del palacio real; y el rey veía la mano que escribía.",
  "5:6": "Entonces el rey palideció y sus pensamientos lo turbaron, se debilitaron sus caderas y sus rodillas daban la una contra la otra.",
  "5:7": "El rey gritó en alta voz que hicieran venir magos, caldeos y adivinos; y dijo el rey a los sabios de Babilonia: «Cualquiera que lea esta escritura y me dé su interpretación, será vestido de púrpura, llevará en su cuello un collar de oro y será el tercer señor en el reino.»",
  "5:10": "La reina, por las palabras del rey y de sus príncipes, entró a la sala del banquete, y dijo: —¡Rey, vive para siempre! No te turben tus pensamientos ni palidezca tu rostro.",
  "5:17": "Entonces Daniel respondió y dijo al rey: —Tus dones sean para ti; da tus recompensas a otros. Leeré la escritura al rey y le daré la interpretación.",
  "5:20": "Pero cuando su corazón se ensoberbeció y su espíritu se endureció en su orgullo, fue depuesto del trono de su reino y despojado de su gloria.",
  "5:21": "Fue echado de entre los hijos de los hombres, su mente se hizo semejante a la de las bestias y con los asnos monteses fue su habitación. Le hicieron comer hierba, como al buey, y su cuerpo se empapó del rocío del cielo, hasta que reconoció que el Altísimo Dios tiene dominio sobre el reino de los hombres, y que pone sobre él al que le place.",
  "5:22": "Pero tú, su hijo Belsasar, no has humillado tu corazón sabiendo todo esto,",
  "5:25": "Y la escritura que trazó es: “Mene, Mene, Tekel, Uparsin.”",
  "5:26": "Esta es la interpretación del asunto: “Mene”: Contó Dios tu reino y le ha puesto fin.",
  "5:27": "“Tekel”: Pesado has sido en balanza y hallado falto.",
  "5:28": "“Peres”: Tu reino ha sido roto y dado a los medos y a los persas.",
  "5:30": "La misma noche fue muerto Belsasar, rey de los caldeos.",
  "5:31": "Y Darío, de Media, cuando tenía sesenta y dos años, tomó el reino.",

  "6:1": "Pareció bien a Darío constituir sobre el reino ciento veinte sátrapas que gobernaran en todo el reino.",
  "6:2": "Y sobre ellos tres gobernadores, de los cuales Daniel era uno, a quienes estos sátrapas dieran cuenta, para que el rey no fuera perjudicado.",
  "6:3": "Pero Daniel mismo era superior a estos sátrapas y gobernadores, porque había en él un espíritu superior; y el rey pensó en ponerlo sobre todo el reino.",
  "6:4": "Los gobernadores y sátrapas buscaron ocasión para acusar a Daniel en lo relacionado con el reino; pero no podían hallar motivo alguno o falta, porque él era fiel, y ningún error ni falta hallaron en él.",
  "6:5": "Entonces dijeron aquellos hombres: «No hallaremos contra este Daniel motivo alguno para acusarlo, si no lo hallamos contra él en relación con la ley de su Dios.»",
  "6:7": "Todos los gobernadores del reino, magistrados, sátrapas, príncipes y capitanes han acordado por consejo que promulgues un edicto real, y lo confirmes, ordenando que cualquiera que en el espacio de treinta días demande petición de cualquier dios u hombre fuera de ti, rey, sea echado al foso de los leones.",
  "6:8": "Ahora, pues, oh rey, confirma el edicto y fírmalo, para que no pueda ser revocado, conforme a la ley de Media y de Persia, que no puede ser abrogada.",
  "6:10": "Cuando Daniel supo que el edicto había sido firmado, entró en su casa; abiertas las ventanas de su habitación que daban a Jerusalén, se arrodillaba tres veces al día, oraba y daba gracias delante de su Dios como solía hacerlo antes.",
  "6:14": "Cuando el rey oyó el asunto, le pesó en gran manera y resolvió librar a Daniel; y hasta la puesta del sol trabajó para librarlo.",
  "6:16": "Entonces el rey ordenó que trajeran a Daniel, y lo echaron al foso de los leones. El rey dijo a Daniel: —El Dios tuyo, a quien tú continuamente sirves, él te libre.",
  "6:17": "Trajeron una piedra y la pusieron sobre la puerta del foso, la cual selló el rey con su anillo y con el anillo de sus príncipes, para que el acuerdo acerca de Daniel no se cambiara.",
  "6:18": "Luego el rey se fue a su palacio, y se acostó en ayunas; no trajeron ante él instrumentos musicales, y se le fue el sueño.",
  "6:19": "El rey se levantó muy de mañana, y fue apresuradamente al foso de los leones.",
  "6:20": "Acercándose al foso, llamó a gritos a Daniel con voz triste, y le dijo: —Daniel, siervo del Dios viviente, el Dios tuyo, a quien tú continuamente sirves, ¿te ha podido librar de los leones?",
  "6:22": "Mi Dios envió su ángel, el cual cerró la boca de los leones para que no me hicieran daño, porque ante él fui hallado inocente; y aun delante de ti, oh rey, yo no he hecho nada malo.",
  "6:23": "Se alegró el rey en gran manera a causa de él, y mandó sacar a Daniel del foso. Sacaron, pues, del foso a Daniel, pero ninguna lesión se halló en él, porque había confiado en su Dios.",

    { t: "m", q: "¿Por qué Daniel era superior a los sátrapas y gobernadores?", o: ["Porque había en él un espíritu superior", "Porque era el más rico", "Porque era amigo del rey desde niño", "Porque era el más anciano"], v: "6:3" },
    { t: "m", q: "¿Por qué no podían hallar falta alguna en Daniel?", o: ["Porque él era fiel", "Porque se escondía del rey", "Porque el rey lo protegía", "Porque no trabajaba en el reino"], v: "6:4" },
    { t: "f", q: "«No hallaremos contra este Daniel motivo alguno para acusarlo, si no lo hallamos contra él en relación con la ley de su ________.»", a: ["Dios"], v: "6:5" },
    { t: "m", q: "¿Por cuánto tiempo prohibía el edicto hacer peticiones a otro dios u hombre fuera del rey?", o: ["Treinta días", "Siete días", "Un año", "Cuarenta días"], v: "6:7" },
    { t: "f", q: "El edicto no podía ser revocado, conforme a la ley de Media y de ________.", a: ["Persia"], v: "6:8" },
    { t: "m", q: "¿Hacia dónde daban las ventanas abiertas de la habitación de Daniel?", o: ["Hacia Jerusalén", "Hacia el palacio del rey", "Hacia el oriente", "Hacia Babilonia"], v: "6:10" },
    { t: "m", q: "¿Cuántas veces al día se arrodillaba Daniel a orar?", o: ["Tres veces", "Dos veces", "Siete veces", "Una vez"], v: "6:10" },
    { t: "m", q: "¿Cómo reaccionó el rey cuando oyó la acusación contra Daniel?", o: ["Le pesó en gran manera y trabajó hasta la puesta del sol para librarlo", "Se alegró y lo mandó al foso de inmediato", "Mandó matar a los acusadores", "No le dio importancia"], v: "6:14" },
    { t: "f", q: "El rey dijo: «El Dios tuyo, a quien tú continuamente ________, él te libre.»", a: ["sirves"], v: "6:16" },
    { t: "m", q: "¿Con qué selló el rey la piedra puesta sobre la puerta del foso?", o: ["Con su anillo y con el anillo de sus príncipes", "Con cera y su espada", "Con cadenas de bronce", "Con el sello de Daniel"], v: "6:17" },
    { t: "m", q: "¿Cómo pasó el rey aquella noche?", o: ["Se acostó en ayunas, sin música, y se le fue el sueño", "Hizo un gran banquete", "Durmió tranquilo en su palacio", "Se quedó junto al foso"], v: "6:18" },
    { t: "m", q: "¿Cuándo fue el rey al foso de los leones?", o: ["Muy de mañana, apresuradamente", "Al mediodía", "Después de tres días", "A la puesta del sol"], v: "6:19" },
    { t: "f", q: "El rey llamó: «Daniel, siervo del Dios ________...»", a: ["viviente"], v: "6:20" },
    { t: "m", q: "Según Daniel, ¿qué hizo el ángel que Dios envió?", o: ["Cerró la boca de los leones", "Mató a los leones", "Sacó a Daniel del foso", "Rompió el sello de la piedra"], v: "6:22" },
    { t: "m", q: "¿Por qué no se halló ninguna lesión en Daniel?", o: ["Porque había confiado en su Dios", "Porque los leones estaban dormidos", "Porque el rey alimentó a los leones", "Porque el foso estaba vacío"], v: "6:23" },
    { t: "m", q: "¿Qué pasó con los hombres que habían acusado a Daniel?", o: ["Fueron echados al foso con sus hijos y sus mujeres, y los leones los despedazaron", "Fueron perdonados por el rey", "Fueron desterrados a Persia", "Fueron echados al horno de fuego"], v: "6:24" },
    { t: "m", q: "¿Qué ordenó el rey Darío en su decreto?", o: ["Que todos teman y tiemblen ante la presencia del Dios de Daniel", "Que nadie orara durante treinta días", "Que todos adoraran al rey", "Que Daniel volviera a Jerusalén"], v: "6:26" },
    { t: "f", q: "Daniel prosperó durante los reinados de Darío y de ________, el persa.", a: ["Ciro"], v: "6:28" }
  ]}
];

// ---------- Lógica ----------
const state = CHAPTERS.map(() => ({ graded: false, score: null }));
let current = 0;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function norm(s) {
  return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9ñ]/g, "");
}
function esc(s) {
  return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// Orden barajado de opciones, fijo durante la sesión hasta reiniciar
const orders = CHAPTERS.map(ch => ch.q.map(q => q.t === "m" ? shuffle(q.o.map((_, i) => i)) : null));

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = CHAPTERS.map((ch, i) => {
    const s = state[i];
    const badge = s.graded ? `<span class="badge">${s.score}/20</span>` : "";
    return `<button class="tab ${i === current ? "active" : ""}" data-i="${i}">Cap. ${ch.n}${badge}</button>`;
  }).join("");
  tabs.querySelectorAll(".tab").forEach(b => b.onclick = () => { current = +b.dataset.i; render(); window.scrollTo(0, 0); });
}

function render() {
  renderTabs();
  const ch = CHAPTERS[current];
  const ci = current;
  const html = ch.q.map((q, qi) => {
    const name = `c${ci}q${qi}`;
    let body;
    if (q.t === "m") {
      body = `<div class="options">` + orders[ci][qi].map(oi =>
        `<label class="opt" data-oi="${oi}"><input type="radio" name="${name}" value="${oi}"><span>${esc(q.o[oi])}</span></label>`
      ).join("") + `</div>`;
    } else {
      body = `<input class="fill" type="text" name="${name}" autocomplete="off" placeholder="Escribe tu respuesta...">`;
    }
    return `<div class="q" id="${name}">
      <div class="q-head"><span class="q-num">${qi + 1}</span>
        <div><div class="q-type">${q.t === "m" ? "Opción múltiple" : "Completar"}</div>
        <div class="q-text">${esc(q.q)}</div></div></div>
      ${body}
      <div class="feedback"></div>
    </div>`;
  }).join("");

  document.getElementById("app").innerHTML = `
    <h2 class="chapter-title">Daniel ${ch.n}: ${esc(ch.title)}</h2>
    <p class="chapter-sub">Responde las 20 preguntas y presiona «Calificar».</p>
    <div class="score" id="score"></div>
    ${html}
    <div class="actions">
      <button class="btn" id="grade">Calificar</button>
      <button class="btn secondary" id="reset">Reiniciar capítulo</button>
      ${current < CHAPTERS.length - 1 ? `<button class="btn secondary" id="next">Siguiente capítulo →</button>` : ""}
    </div>`;

  document.getElementById("grade").onclick = grade;
  document.getElementById("reset").onclick = reset;
  const next = document.getElementById("next");
  if (next) next.onclick = () => { current++; render(); window.scrollTo(0, 0); };
}

function grade() {
  const ci = current, ch = CHAPTERS[ci];
  let ok = 0;
  ch.q.forEach((q, qi) => {
    const box = document.getElementById(`c${ci}q${qi}`);
    const fb = box.querySelector(".feedback");
    let right, given, correctText;
    if (q.t === "m") {
      const sel = box.querySelector("input:checked");
      given = sel ? q.o[+sel.value] : null;
      right = sel && +sel.value === 0;
      correctText = q.o[0];
      box.querySelectorAll(".opt").forEach(l => {
        l.classList.remove("is-correct", "is-wrong");
        if (+l.dataset.oi === 0) l.classList.add("is-correct");
        else if (sel && l.contains(sel)) l.classList.add("is-wrong");
      });
    } else {
      const val = box.querySelector(".fill").value.trim();
      given = val || null;
      right = !!val && q.a.some(a => norm(a) === norm(val));
      correctText = q.a[0];
    }
    box.classList.toggle("correct", !!right);
    box.classList.toggle("wrong", !right);
    if (right) {
      ok++;
      fb.className = "feedback show ok";
      fb.innerHTML = "✓ ¡Correcto!";
    } else {
      fb.className = "feedback show bad";
      fb.innerHTML = `<div class="label">✗ Incorrecto${given ? "" : " (sin responder)"}</div>
        ${given ? `<div>Tu respuesta: ${esc(given)}</div>` : ""}
        <div><b>Respuesta correcta:</b> ${esc(correctText)}</div>
        <div class="verse"><b>Daniel ${q.v}</b> — ${esc(V[q.v] || "")}</div>`;
    }
  });
  state[ci] = { graded: true, score: ok };
  const sc = document.getElementById("score");
  const pct = Math.round(ok / ch.q.length * 100);
  const msg = pct === 100 ? "¡Excelente, perfecto!" : pct >= 80 ? "¡Muy bien!" : pct >= 60 ? "Bien, pero repasa los versículos marcados." : "Sigue estudiando, ¡tú puedes!";
  sc.className = "score show";
  sc.innerHTML = `Resultado: <strong>${ok} / ${ch.q.length}</strong> (${pct}%)<br>${msg}`;
  renderTabs();
  sc.scrollIntoView({ behavior: "smooth", block: "center" });
}

function reset() {
  const ci = current;
  orders[ci] = CHAPTERS[ci].q.map(q => q.t === "m" ? shuffle(q.o.map((_, i) => i)) : null);
  state[ci] = { graded: false, score: null };
  render();
  window.scrollTo(0, 0);
}

render();
</script>
