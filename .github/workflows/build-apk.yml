name: Compilar APK

# Se ejecuta al subir cambios y tambien a mano desde la pestaña Actions
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Agregar permisos de alarmas
        run: node scripts/permisos-android.js

      - name: Generar iconos y splash con el logo
        run: npx @capacitor/assets generate --android || echo "Sigo con los iconos por defecto"

      - name: Sincronizar la app web
        run: npx cap sync android

      - name: Numerar versión automáticamente
        run: |
          GRADLE=android/app/build.gradle
          # versionCode = número de compilación (siempre creciente)
          sed -i "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/" $GRADLE
          # versionName = 6.0.<build> para que se vea en Android
          sed -i "s/versionName \"[^\"]*\"/versionName \"6.0.${GITHUB_RUN_NUMBER}\"/" $GRADLE
          echo "--- versión aplicada ---"
          grep -E "versionCode|versionName" $GRADLE

      - name: Restaurar la clave de firma
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/cuentasclaras.keystore
          echo "Keystore restaurado en: $(pwd)/android/app/cuentasclaras.keystore"
          ls -la android/app/cuentasclaras.keystore

      - name: Compilar el APK firmado
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/app/cuentasclaras.keystore" \
            -Pandroid.injected.signing.store.password=CuentasClaras2026 \
            -Pandroid.injected.signing.key.alias=cuentasclaras \
            -Pandroid.injected.signing.key.password=CuentasClaras2026

      - name: Renombrar el APK
        run: cp android/app/build/outputs/apk/release/app-release.apk CuentasClaras.apk

      - name: Publicar el APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: CuentasClaras-APK
          path: CuentasClaras.apk
          retention-days: 90
