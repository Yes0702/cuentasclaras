name: Compilar APK y AAB

# Se ejecuta al subir cambios (solo compila, no publica nada) y también a
# mano desde la pestaña Actions. Cuando se lanza a mano CON un número de
# "version", además publica una Release en GitHub con el APK, el AAB y el
# version.json que usan el botón de descarga y el aviso de actualización
# dentro de la app. Sin ese dato, un push normal a main NUNCA publica una
# Release — solo deja los archivos como Artifact para pruebas.
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar en Releases (ej: 9.12). Vacío = solo compilar, sin publicar.'
        required: false
        default: ''
      titulo:
        description: 'Título de la Release (ej: Cuentas Claras 9.12). Vacío = "Cuentas Claras <version>".'
        required: false
        default: ''
      novedades:
        description: 'Notas de esta versión (se muestran en el aviso de actualización dentro de la app).'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Bloquear el tamaño de letra del sistema
        run: node scripts/textzoom-android.js

      - name: Agregar permisos de alarmas
        run: node scripts/permisos-android.js

      - name: Generar iconos y splash con el logo
        run: npx @capacitor/assets generate --android || echo "Sigo con los iconos por defecto"

      - name: Sincronizar la app web
        run: npx cap sync android

      - name: Numerar versión automáticamente
        env:
          # Los datos escritos a mano en Actions entran como variables de entorno
          # (no pegados dentro del script): así unas comillas o un $( ) en el texto
          # no rompen la compilación ni se ejecutan como comandos.
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          GRADLE=android/app/build.gradle
          # Si se lanzó a mano con un número de versión, se usa ese (ej: 9.12).
          # Si no, se arma uno de prueba con el número de ejecución.
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ]; then VERSION="9.10.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # versionCode = número de compilación (siempre creciente)
          sed -i "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/" $GRADLE
          # versionName = lo que se ve en Android
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" $GRADLE
          echo "--- versión aplicada ---"
          grep -E "versionCode|versionName" $GRADLE

      - name: Restaurar la clave de firma
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/cuentasclaras.keystore
          echo "Keystore restaurado en: $(pwd)/android/app/cuentasclaras.keystore"
          ls -la android/app/cuentasclaras.keystore

      - name: Mostrar huella digital del certificado (para comparar entre versiones)
        run: |
          keytool -list -v \
            -keystore android/app/cuentasclaras.keystore \
            -storepass CuentasClaras2026 \
            -alias cuentasclaras | grep -A1 "SHA256:"

      - name: Compilar el APK firmado
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/app/cuentasclaras.keystore" \
            -Pandroid.injected.signing.store.password=CuentasClaras2026 \
            -Pandroid.injected.signing.key.alias=cuentasclaras \
            -Pandroid.injected.signing.key.password=CuentasClaras2026

      - name: Guardar el APK de GitHub
        # Se copia YA, antes de convertir el proyecto en la versión de Play.
        run: cp android/app/build/outputs/apk/release/app-release.apk CuentasClaras.apk

      - name: Convertir el proyecto en la versión para Google Play
        # Solo para el AAB: sin actualizador propio, sin donaciones, sin los
        # permisos que Play restringe y apuntando a Android 16 (API 36).
        run: node scripts/variante-play.js

      - name: Compilar el AAB firmado (para Play Store)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/app/cuentasclaras.keystore" \
            -Pandroid.injected.signing.store.password=CuentasClaras2026 \
            -Pandroid.injected.signing.key.alias=cuentasclaras \
            -Pandroid.injected.signing.key.password=CuentasClaras2026

      - name: Compilar un APK de prueba idéntico al de Play
        # Mismo contenido que el AAB, pero instalable a mano, para probar en un
        # celular cómo se verá la versión de Play antes de subirla. NO se publica.
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/app/cuentasclaras.keystore" \
            -Pandroid.injected.signing.store.password=CuentasClaras2026 \
            -Pandroid.injected.signing.key.alias=cuentasclaras \
            -Pandroid.injected.signing.key.password=CuentasClaras2026
          cp app/build/outputs/apk/release/app-release.apk ../CuentasClaras-PLAY-prueba.apk

      - name: Renombrar el AAB
        run: cp android/app/build/outputs/bundle/release/app-release.aab CuentasClaras.aab

      - name: Verificar que cada versión quedó como debe
        # Si algo no cuadra, la compilación FALLA aquí y no se publica nada.
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          echo "=== APK de GitHub ==="
          "$AAPT2" dump badging CuentasClaras.apk | grep -E "^package:|targetSdkVersion|uses-permission" | tee gh.txt
          grep -q "REQUEST_INSTALL_PACKAGES" gh.txt || { echo "❌ El APK de GitHub perdió el permiso para instalar actualizaciones"; exit 1; }
          unzip -p CuentasClaras.apk assets/public/index.html | grep -q 'const CC_CANAL = "github";' || { echo "❌ El APK de GitHub no quedó como versión GitHub"; exit 1; }
          echo "=== Versión Play (APK de prueba, mismo contenido que el AAB) ==="
          "$AAPT2" dump badging CuentasClaras-PLAY-prueba.apk | grep -E "^package:|targetSdkVersion|uses-permission" | tee play.txt
          for p in REQUEST_INSTALL_PACKAGES USE_EXACT_ALARM; do
            if grep -q "android.permission.$p'" play.txt; then echo "❌ La versión Play todavía pide $p"; exit 1; fi
          done
          grep -q "targetSdkVersion:'36'" play.txt || { echo "❌ La versión Play no apunta a Android 16 (API 36)"; exit 1; }
          unzip -p CuentasClaras.aab base/assets/public/index.html | grep -q 'const CC_CANAL = "play";' || { echo "❌ El AAB no quedó marcado como versión Play"; exit 1; }
          if unzip -p CuentasClaras.aab base/manifest/AndroidManifest.xml | strings | grep -qE "REQUEST_INSTALL_PACKAGES|USE_EXACT_ALARM"; then echo "❌ El AAB todavía pide un permiso restringido"; exit 1; fi
          echo "✅ APK de GitHub y AAB de Play verificados"

      - name: Publicar el APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: CuentasClaras-APK
          path: CuentasClaras.apk
          retention-days: 90

      - name: Publicar el AAB para Play Store
        uses: actions/upload-artifact@v4
        with:
          name: CuentasClaras-AAB
          path: CuentasClaras.aab
          retention-days: 90

      - name: Publicar el APK de prueba de la versión Play
        uses: actions/upload-artifact@v4
        with:
          name: CuentasClaras-PLAY-prueba-APK
          path: CuentasClaras-PLAY-prueba.apk
          retention-days: 30

      - name: Generar version.json
        if: ${{ github.event.inputs.version != '' }}
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
          NOVEDADES_INPUT: ${{ github.event.inputs.novedades }}
          REPO: ${{ github.repository }}
        run: |
          # Se arma con Node para que las comillas, saltos de línea o símbolos de las
          # novedades queden bien escritos dentro del JSON.
          node -e '
            const v = process.env.VERSION_INPUT;
            const info = {
              version: v,
              url: "https://github.com/" + process.env.REPO + "/releases/download/v" + v + "/CuentasClaras.apk",
              novedades: process.env.NOVEDADES_INPUT || ""
            };
            require("fs").writeFileSync("version.json", JSON.stringify(info, null, 2) + "\n");
          '
          cat version.json

      - name: Publicar Release en GitHub
        if: ${{ github.event.inputs.version != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
          TITULO_INPUT: ${{ github.event.inputs.titulo }}
          NOVEDADES_INPUT: ${{ github.event.inputs.novedades }}
          REPO: ${{ github.repository }}
        run: |
          TAG="v$VERSION_INPUT"
          TITULO="$TITULO_INPUT"
          if [ -z "$TITULO" ]; then TITULO="Cuentas Claras $VERSION_INPUT"; fi
          NOTAS="$NOVEDADES_INPUT"
          if [ -z "$NOTAS" ]; then NOTAS="Nueva versión de Cuentas Claras."; fi
          # Si ese tag ya tenía una Release publicada (ej: se corrigió algo antes de que
          # alguien la descargara), se reemplaza por completo en vez de fallar por duplicado
          # — borra la Release vieja y su tag, y publica de nuevo apuntando al commit actual.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "La Release $TAG ya existía: se reemplaza."
            gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            CuentasClaras.apk CuentasClaras.aab version.json \
            --title "$TITULO" \
            --notes "$NOTAS" \
            --repo "$REPO"
